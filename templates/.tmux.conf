# rendered by spark install.sh from templates/.tmux.conf -- edit site.env or the template
# Colours come from SITE_THEME (@THEME_BG@ etc.); `none` keeps the terminal's own.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -sg escape-time 10
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse off
setw -g mode-keys vi
set -g focus-events on

# the status line: name on the left, `spark bar line` on the right, every 15 s
set -g status on
set -g status-interval 15
set -g status-style "bg=@THEME_BG@,fg=@THEME_FG@"
set -g status-left " #[fg=@THEME_ACCENT@,bold]@NAME@#[default] "
set -g status-left-length 30
set -g status-right "#(spark bar line)"
set -g status-right-length 140
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #[fg=@THEME_ACCENT@,bold]#I #W#[default] "
setw -g window-status-current-style "fg=@THEME_ACCENT@"
set -g pane-border-style "fg=@THEME_MUTED@"
set -g pane-active-border-style "fg=@THEME_ACCENT@"
set -g message-style "bg=@THEME_BG@,fg=@THEME_ACCENT@"
# The Linux console has 16 colours, so a hex palette collapses (a light
# theme's bar and text become the same colour): a client from the console
# gets tmux's default styles; every other client gets the palette.
set-hook -g client-attached 'if -F "#{==:#{client_termname},linux}" "set -g status-style default ; set -g message-style default ; set -g pane-border-style default ; set -g pane-active-border-style default" "set -g status-style bg=@THEME_BG@,fg=@THEME_FG@ ; set -g message-style bg=@THEME_BG@,fg=@THEME_ACCENT@ ; set -g pane-border-style fg=@THEME_MUTED@ ; set -g pane-active-border-style fg=@THEME_ACCENT@"'

# keys: prefix stays C-b; splits that keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
