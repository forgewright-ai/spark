name: Bug report
description: Something on your machine does not match what spark promises
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        GitHub issues are public. Share the version, OS and steps using
        made-up names and paths. Prefer `spark check --report` for status.
        Review any other output before posting it. Remove private prompts,
        account names, paths, addresses and tokens. Never post a login QR
        screenshot.

        An agent reads this report within the hour, follows your steps
        and answers here. Steps it cannot follow come back as a question.
  - type: input
    id: version
    attributes:
      label: spark ver
      description: The first line `spark ver` prints
      placeholder: spark 1.88
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Debian or Ubuntu
        - Arch
        - Void
        - Fedora
        - openSUSE
        - macOS
        - WSL 2
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: Debian 13, Ubuntu 24.04, macOS 26, Tumbleweed 20261011
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use made-up names and paths. What you typed, one command a line, from a fresh shell.
      render: sh
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What you saw
      description: GitHub issues are public. Share only the lines needed to explain the problem, after removing private text and identifiers.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: spark check --report
      description: Statuses only, no names, no paths. Safe to paste. `spark check --porcelain` adds values, if you are comfortable sharing them.
      render: text
