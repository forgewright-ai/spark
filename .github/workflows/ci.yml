# spark CI -- where the full gate runs, once per commit. The workstation
# runs the fast half (.githooks/pre-commit); a commit comes here on a try/
# branch (tests/land.sh), and main is fast-forwarded to it only when every
# job is green. release.yml refuses a tag whose commit has no green run.
# linux, macos: `tests/gate.sh full`, the one test list, one job per group
# (smoke, serve, rest) -- the two long suites on runners of their own,
# never side by side on one. The rest job then runs a REAL bootstrap on
# the runner (a fresh Ubuntu with sudo; on macOS the core, and not on a
# pull request), which must converge to "Nothing to do" and pass `spark
# check`. macOS runs under Apple's python 3.9.
# debian: the README's first-named platform, as a new user meets it -- a
# Debian 13 container, a user made for the run, the one-liner in pipe form
# from the tree under test, the AI layer only; converges the same way.
# arch: the second family, the same new user in an Arch container --
# packages through pacman (Arch's base already holds the AI's library).
# void: the third family, the same new user in a Void container -- packages
# through xbps, the services under runit: a runsvdir started by root stands
# in for the booted machine's, so spark-check runs supervised there.
# workflows: zizmor, a pinned version in a venv, over these workflows
# themselves -- an unpinned action, a template expanded into a shell, a
# permission nobody uses; medium and above fails.
# No job downloads a model or the engine: SITE_AI_MODEL=none everywhere,
# and without a model bootstrap skips the engine. The distro's packages
# are the only download.
# A tag push runs nothing here: the tag's commit already passed. A newer
# push cancels an older run on a try/ branch or a pull request, never on
# main -- every commit main receives keeps its own finished run.
name: ci
on:
  push:
    branches: [main, 'try/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [smoke, serve, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # spark ver derives from git describe: get_test and update_test need real tags
          persist-credentials: false
      - name: shellcheck
        if: matrix.group == 'rest'
        run: sudo apt-get install -y -qq shellcheck >/dev/null
      - name: the gate
        # the personal word list is a repository secret (one word per
        # line), read by the whole-tree privacy gate in the rest group; a
        # hit names the file, never the line -- this log is public. A fork
        # without it gets a NOTICE and the generic patterns only. The
        # group goes through env, never into the script's text.
        env:
          GROUP: ${{ matrix.group }}
          SPARK_PRIVACY_TERMS_SECRET: ${{ matrix.group == 'rest' && secrets.SPARK_PRIVACY_TERMS || '' }}
        run: sh tests/gate.sh full "$GROUP"
      - name: real bootstrap on the runner
        if: matrix.group == 'rest'
        env:
          SITE_AI_MODEL: none
        run: |
          mkdir -p ~/.config/spark
          ./bootstrap.sh
          ./bootstrap.sh --dry-run | tee /tmp/dry.txt
          grep -q '^Nothing to do$' /tmp/dry.txt
          # no model here: serve stays on demand and the forge (auto) stays off -- a skip, never a fail
          grep -qE '^skip +(spark-forge|systemd) ' /tmp/dry.txt
          ~/.local/bin/spark check --fresh || true
          ~/.local/bin/spark check --porcelain --fresh | awk -F'\t' '$1=="SOFTWARE" && $2=="fail" && $3!="services" { bad=1; print } END { exit bad }'
  debian:
    # the new user's first ten minutes, on the platform the README names
    # first: a user who is not root, sudo without a password (so setup's
    # `sudo -n true` says yes and bootstrap's apt row runs), stdin a pipe
    # (setup takes every default, asks nothing), no model. There is no
    # systemd in a container: the services rows skip, and `spark check`
    # reads `na` for services, as docs/INSTALL.md, section 6 (the container
    # note) promises.
    runs-on: ubuntu-latest
    # debian:13 pinned by its multi-arch index digest: a tag can move, a digest
    # is the image. Moved by hand (Docker Hub: the manifest of debian:13)
    container: debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # git first: without it in the container, actions/checkout downloads a
      # tarball with no .git, and the new user's clone has nothing to clone
      - run: apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # a full history: the new user's clone comes from this tree, and
          # `spark ver` describes it
          fetch-depth: 0
          persist-credentials: false
      - name: a new user with sudo
        run: |
          apt-get update -qq && apt-get install -y -qq sudo git curl ca-certificates python3 >/dev/null
          useradd -m -s /bin/bash newuser
          echo 'newuser ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/newuser && chmod 440 /etc/sudoers.d/newuser
          # the checkout is root-owned; a file:// clone runs upload-pack in it as newuser
          git config --system safe.directory '*'
          # the clone takes the branch HEAD points at: give a detached checkout one
          git -C "$GITHUB_WORKSPACE" symbolic-ref -q HEAD >/dev/null || git -C "$GITHUB_WORKSPACE" checkout -q -B ci
      - name: the one-liner, pipe form, from the tree under test
        run: |
          # SPARK_REF: a new user lands on the newest tag, which is the release
          # before this one -- the job proves the tree under test, so name its branch
          ref=$(git -C "$GITHUB_WORKSPACE" symbolic-ref -q --short HEAD || echo ci)
          sudo -u newuser -H env SITE_AI_MODEL=none SPARK_URL="file://$GITHUB_WORKSPACE" SPARK_REF="$ref" \
            sh -c 'cat "$1" | sh' _ "$GITHUB_WORKSPACE/get"
      - name: converged, checked, hooked
        run: |
          sudo -u newuser -H sh -c '~/.spark/bootstrap.sh --dry-run' | tee /tmp/dry.txt
          grep -q '^Nothing to do$' /tmp/dry.txt
          # no systemd in a container: the units skip, never fail
          grep -qE '^skip +systemd ' /tmp/dry.txt
          sudo -u newuser -H sh -c '~/.local/bin/spark check --fresh' || true
          sudo -u newuser -H sh -c '~/.local/bin/spark check --porcelain --fresh' > /tmp/porcelain.txt
          awk -F'\t' '$1=="SOFTWARE" && $2=="fail" && $3!="services" { bad=1; print } END { exit bad }' /tmp/porcelain.txt
          # docs/INSTALL.md, section 6 (the container note): without a user systemd session the services row reads na
          awk -F'\t' '$3=="services" { print; found=1; if ($2!="na") bad=1 } END { exit bad || !found }' /tmp/porcelain.txt
          # the core rc hook: one marked line at the end of the new user's .bashrc
          sudo -u newuser -H sh -c 'grep -q "config/spark/hook\." ~/.bashrc'
  arch:
    # the second family: the same new user, the same one-liner, in an Arch
    # container -- packages through pacman (kbd proves the install path;
    # Arch's base already holds gcc-libs, llama.cpp's OpenMP), the console
    # row unset here and the GRUB row an honest skip without a UKI.
    runs-on: ubuntu-latest
    container: archlinux:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Arch there is, and -Syu moves it to today anyway
    timeout-minutes: 20
    steps:
      # git first, as in the debian job; -Syu is the image's own rule (a
      # rolling distro: never -Sy alone)
      - run: pacman -Syu --noconfirm --needed git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a new user with sudo
        run: |
          pacman -S --noconfirm --needed sudo curl python >/dev/null
          useradd -m -s /bin/bash newuser
          echo 'newuser ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/newuser && chmod 440 /etc/sudoers.d/newuser
          git config --system safe.directory '*'
          git -C "$GITHUB_WORKSPACE" symbolic-ref -q HEAD >/dev/null || git -C "$GITHUB_WORKSPACE" checkout -q -B ci
      - name: the one-liner, pipe form, from the tree under test
        run: |
          ref=$(git -C "$GITHUB_WORKSPACE" symbolic-ref -q --short HEAD || echo ci)
          sudo -u newuser -H env SITE_AI_MODEL=none SPARK_URL="file://$GITHUB_WORKSPACE" SPARK_REF="$ref" \
            sh -c 'cat "$1" | sh' _ "$GITHUB_WORKSPACE/get"
      - name: converged, checked, hooked
        run: |
          sudo -u newuser -H sh -c '~/.spark/bootstrap.sh --dry-run' | tee /tmp/dry.txt
          grep -q '^Nothing to do$' /tmp/dry.txt
          grep -qE '^skip +systemd ' /tmp/dry.txt
          grep -qE '^ok +packages ' /tmp/dry.txt
          sudo -u newuser -H sh -c '~/.local/bin/spark check --fresh' || true
          sudo -u newuser -H sh -c '~/.local/bin/spark check --porcelain --fresh' > /tmp/porcelain.txt
          awk -F'\t' '$1=="SOFTWARE" && $2=="fail" && $3!="services" { bad=1; print } END { exit bad }' /tmp/porcelain.txt
          awk -F'\t' '$3=="services" { print; found=1; if ($2!="na") bad=1 } END { exit bad || !found }' /tmp/porcelain.txt
          sudo -u newuser -H sh -c 'grep -q "config/spark/hook\." ~/.bashrc'
  void:
    # the third family: xbps for the packages and runit for the services.
    # A runsvdir started by root in the container stands in for the booted
    # machine's, so this job proves what debian and arch cannot: bootstrap
    # writes the user's runsvdir service, and spark-check runs supervised.
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Void there is, and -Su moves it to today anyway
    timeout-minutes: 20
    steps:
      # git first, as in the debian job; xbps itself first (a rolling
      # distro refuses every install while xbps is behind); bash for the
      # new user's shell and libstdc++ for the runner's node
      - run: xbps-install -Syu xbps >/dev/null 2>&1 || true; xbps-install -Syu >/dev/null; xbps-install -Sy git ca-certificates bash libstdc++ >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a new user with sudo
        run: |
          xbps-install -Sy sudo curl python3 >/dev/null
          useradd -m -s /bin/bash newuser
          echo 'newuser ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/newuser && chmod 440 /etc/sudoers.d/newuser
          git config --system safe.directory '*'
          git -C "$GITHUB_WORKSPACE" symbolic-ref -q HEAD >/dev/null || git -C "$GITHUB_WORKSPACE" checkout -q -B ci
      - name: runit, as a booted Void has it
        run: |
          # stage 2's layout: /var/service resolves to the default runsvdir,
          # and one runsvdir supervises it (setsid: it outlives this step)
          mkdir -p /etc/sv /etc/runit/runsvdir/default /run/runit/runsvdir
          ln -sfn /etc/runit/runsvdir/default /run/runit/runsvdir/current
          [ -d /var/service ] || { rm -f /var/service; ln -s /run/runit/runsvdir/current /var/service; }
          setsid -f runsvdir -P /var/service >/dev/null 2>&1 </dev/null
          sleep 1; pgrep -x runsvdir >/dev/null
      - name: the one-liner, pipe form, from the tree under test
        run: |
          ref=$(git -C "$GITHUB_WORKSPACE" symbolic-ref -q --short HEAD || echo ci)
          sudo -u newuser -H env SITE_AI_MODEL=none SPARK_URL="file://$GITHUB_WORKSPACE" SPARK_REF="$ref" \
            sh -c 'cat "$1" | sh' _ "$GITHUB_WORKSPACE/get"
      - name: converged, checked, supervised, hooked
        run: |
          sudo -u newuser -H sh -c '~/.spark/bootstrap.sh --dry-run' | tee /tmp/dry.txt
          grep -q '^Nothing to do$' /tmp/dry.txt
          grep -qE '^ok +packages ' /tmp/dry.txt
          # runit is live here: the user's runsvdir service is written and spark-check runs under it
          grep -qE '^ok +supervisor ' /tmp/dry.txt
          grep -qE '^ok +spark-check +supervised' /tmp/dry.txt
          sudo -u newuser -H sh -c 'sv status ~/.config/spark/sv/spark-check' | grep '^run:'
          sudo -u newuser -H sh -c '~/.local/bin/spark check --fresh' || true
          sudo -u newuser -H sh -c '~/.local/bin/spark check --porcelain --fresh' > /tmp/porcelain.txt
          awk -F'\t' '$1=="SOFTWARE" && $2=="fail" { bad=1; print } END { exit bad }' /tmp/porcelain.txt
          # the services row is REAL here (runit live), never na
          awk -F'\t' '$3=="services" { print; found=1; if ($2!="ok") bad=1 } END { exit bad || !found }' /tmp/porcelain.txt
          sudo -u newuser -H sh -c 'grep -q "config/spark/hook\." ~/.bashrc'
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [smoke, serve, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # spark ver derives from git describe: get_test and update_test need real tags
          persist-credentials: false
      - name: the gate, under Apple's python
        env:
          GROUP: ${{ matrix.group }}
          SPARK_GATE_PYTHON: /usr/bin/python3
        run: sh tests/gate.sh full "$GROUP"
      - name: real core bootstrap on the runner
        # the AI layer as a Mac user gets it without a model: the token,
        # the tools, one line in ~/.zshrc, no Homebrew, no engine (it comes
        # with a model). Not on a pull request. SHELL names the Mac user's
        # login shell; the runner's own is bash 3, which cannot host the
        # widget (a todo row, by design).
        if: matrix.group == 'rest' && github.event_name != 'pull_request'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          SHELL: /bin/zsh
        run: |
          mkdir -p ~/.config/spark
          printf 'SITE_AI_MODEL=none\n' > ~/.config/spark/site.env
          time ./bootstrap.sh
          ./bootstrap.sh --dry-run | tee /tmp/dry.txt
          if [ "$(tail -1 /tmp/dry.txt)" != 'Nothing to do' ]; then
            # the runner's own Homebrew may upgrade itself under the build
            # (brew, wheel3 moved in /opt/homebrew/bin): say what moved, and
            # one more pass must converge
            PYTHONPATH=lib python3 -m spark.intake fresh || true
            ./bootstrap.sh >/dev/null
            ./bootstrap.sh --dry-run | tee /tmp/dry.txt
            [ "$(tail -1 /tmp/dry.txt)" = 'Nothing to do' ] || { PYTHONPATH=lib python3 -m spark.intake fresh; false; }
          fi
          grep -q 'config/spark/hook\.' ~/.zshrc
          ~/.local/bin/spark check --fresh || true
          # a runner may have no gui launchd domain: the launchd rows skip and services may fail; nothing else may
          ~/.local/bin/spark check --porcelain --fresh | awk -F'\t' '$1=="SOFTWARE" && $2=="fail" && $3!="services" { bad=1; print } END { exit bad }'
  workflows:
    # the workflows are code too, and the gate does not read YAML: zizmor
    # (pinned, in a venv of its own) reads every file under
    # .github/workflows for an action pinned to a tag instead of a sha, a
    # `${{ }}` expanded inside a run script, a job holding more permission
    # than it uses, a checkout that leaves the token on disk. A finding
    # this tree means is ignored inline, with its reason on the line.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor over .github/workflows
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet zizmor==1.30.1
          "$RUNNER_TEMP/zizmor/bin/zizmor" --version
          "$RUNNER_TEMP/zizmor/bin/zizmor" --min-severity medium .github/workflows
