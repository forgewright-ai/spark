# line-audition-help -- the help snapshots the prompt-line audition
# (tests/line_audition.py) grades against, gathered ON each OS: whether
# every tool its cases name exists there, its --help or man synopsis, the
# options those name, and what a knowledge store indexes (the man NAME
# line, up to 3 synopsis lines, up to 60 option lines with their first
# sentence), so `line_audition.py recall` and a run can ground a question
# in that OS's manuals from any machine. Verification trusts outcomes,
# not the model: an answer passes only when its head command exists on
# that OS and every option it passes is in that OS's own help.
# Each job starts from the same image ci.yml proves spark on, installs
# the tools the cases name (`line_audition.py packages`, one at a time, so
# a renamed package is a line in the log and not a dead job), and uploads
# help-<os>.json. The files are then committed to tests/line_audition/ by
# hand. Nothing in a snapshot is ever run. workflow_dispatch only: no
# push or schedule refreshes it.
name: line-audition-help
on: workflow_dispatch
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-latest
    # debian:13 pinned by its multi-arch index digest: a tag can move, a digest
    # is the image. Moved by hand (Docker Hub: the manifest of debian:13)
    container: debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git ca-certificates python3 >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the tools the cases name, with their man pages
        run: |
          # a slim image drops the man pages: the snapshot wants them
          rm -f /etc/dpkg/dpkg.cfg.d/docker /etc/dpkg/dpkg.cfg.d/excludes
          for p in $(python3 tests/line_audition.py packages --os debian); do
            apt-get install -y -qq "$p" >/dev/null 2>&1 || echo "not installed: $p"
          done
      - name: collect
        run: python3 tests/line_audition.py collect --os debian --out help-debian.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: help-debian
          path: help-debian.json
          if-no-files-found: error
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Arch there is, and -Syu moves it to today anyway
    timeout-minutes: 20
    steps:
      - run: pacman -Syu --noconfirm --needed git ca-certificates python >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the tools the cases name, with their man pages
        run: |
          # the image's pacman.conf extracts no man page: drop that line,
          # then install (or reinstall, without --needed) so the pages land
          sed -i '/^NoExtract/d' /etc/pacman.conf
          for p in $(python3 tests/line_audition.py packages --os arch); do
            pacman -S --noconfirm "$p" >/dev/null 2>&1 || echo "not installed: $p"
          done
          ls /usr/share/man/man8/pacman.8* /usr/share/man/man1 2>/dev/null | wc -l
      - name: collect
        run: python3 tests/line_audition.py collect --os arch --out help-arch.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: help-arch
          path: help-arch.json
          if-no-files-found: error
  void:
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Void there is, and -Su moves it to today anyway
    timeout-minutes: 20
    steps:
      # xbps itself first (a rolling distro refuses every install while
      # xbps is behind); libstdc++ for the runner's node, as in ci.yml
      - run: xbps-install -Syu xbps >/dev/null 2>&1 || true; xbps-install -Syu >/dev/null; xbps-install -Sy git ca-certificates bash libstdc++ python3 >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the tools the cases name, with their man pages
        run: |
          # a noextract line would drop the man pages: none may stay, in
          # /etc/xbps.d or in the image's own /usr/share/xbps.d; a copy in
          # /etc/xbps.d with the same name overrides the shipped one
          mkdir -p /etc/xbps.d
          for f in /etc/xbps.d/*.conf /usr/share/xbps.d/*.conf; do
            [ -f "$f" ] && grep -q '^noextract' "$f" && sed '/^noextract/d' "$f" > "/etc/xbps.d/$(basename "$f")"
          done
          # -f reinstalls what the image already holds, so its pages land too
          for p in $(python3 tests/line_audition.py packages --os void); do
            xbps-install -fy "$p" >/dev/null 2>&1 || xbps-install -y "$p" >/dev/null 2>&1 || echo "not installed: $p"
          done
          ls /usr/share/man/man1 | wc -l
      - name: the man reader, with its own output
        # mandoc (package mdocml) is Void's man: without it no page is read. Its install
        # is its own step, loud, so a failure says why
        run: xbps-install -Sy mdocml && command -v mandoc && command -v man && man -w ls
      - name: collect
        run: python3 tests/line_audition.py collect --os void --out help-void.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: help-void
          path: help-void.json
          if-no-files-found: error
  fedora:
    runs-on: ubuntu-latest
    # fedora:44 pinned by its multi-arch index digest, as in ci.yml
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    timeout-minutes: 20
    steps:
      - run: dnf install -y git ca-certificates python3 >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the tools the cases name, with their man pages
        run: |
          # the image's dnf.conf installs no documentation: drop that
          # line and bring the image to today, so every package it holds
          # can be reinstalled. Install the tools (--allowerasing:
          # coreutils replaces the image's coreutils-single), then
          # reinstall everything, so the man pages of what the base
          # already held land too (ls's are in coreutils-common)
          sed -i '/^tsflags=nodocs/d' /etc/dnf/dnf.conf
          dnf upgrade -y >/dev/null 2>&1 || echo "not upgraded"
          for p in $(python3 tests/line_audition.py packages --os fedora); do
            rpm -q "$p" >/dev/null 2>&1 || dnf install -y --allowerasing "$p" >/dev/null 2>&1 || echo "not installed: $p"
          done
          dnf reinstall -y --skip-unavailable '*' >/dev/null 2>&1 || echo "not reinstalled: the base"
          ls /usr/share/man/man8/dnf*.8* /usr/share/man/man1 2>/dev/null | wc -l
      - name: collect
        run: python3 tests/line_audition.py collect --os fedora --out help-fedora.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: help-fedora
          path: help-fedora.json
          if-no-files-found: error
  opensuse:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Tumbleweed there is, and dup moves it to today anyway
    timeout-minutes: 20
    steps:
      - run: zypper --non-interactive dup --no-recommends >/dev/null; zypper --non-interactive install --no-recommends git ca-certificates python3 >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the tools the cases name, with their man pages
        run: |
          # the image installs no documentation: its zypp.conf.d drop-in
          # says so, and goes. Install the tools, then --force reinstalls
          # everything, so the man pages of what the base already held
          # land too. --force-resolution: man, gawk and less replace the
          # image's busybox ones, as on an installed Tumbleweed
          rm -f /usr/etc/zypp/zypp.conf.d/excludedocs.conf /etc/zypp/zypp.conf.d/excludedocs.conf
          for p in $(python3 tests/line_audition.py packages --os opensuse); do
            zypper --non-interactive install --no-recommends --force-resolution "$p" >/dev/null 2>&1 || echo "not installed: $p"
          done
          rpm -qa --qf '%{NAME}\n' | grep -v '^gpg-pubkey' | xargs zypper --non-interactive install --no-recommends --force >/dev/null 2>&1 || echo "not reinstalled: the base"
          ls /usr/share/man/man8/zypper.8* /usr/share/man/man1 2>/dev/null | wc -l
      - name: collect
        run: python3 tests/line_audition.py collect --os opensuse --out help-opensuse.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: help-opensuse
          path: help-opensuse.json
          if-no-files-found: error
  macos:
    # a stock runner, nothing installed: the system's own tools first on
    # the PATH collect uses, Homebrew's after
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: collect
        run: /usr/bin/python3 tests/line_audition.py collect --os macos --out help-macos.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: help-macos
          path: help-macos.json
          if-no-files-found: error
