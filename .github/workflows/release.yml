# spark release -- a v* tag on a green commit becomes a GitHub Release whose
# notes are that version's CHANGELOG section. The tag must be on main,
# named as its object says, and signed by a key in the PREVIOUS release's
# allowed-signers (what spark update and get verify before they move),
# and must agree with the code: the `## vX.Y` heading,
# and `spark ver` (which derives the version from the tag itself, via git
# describe -- lib/spark/version.py) saying the same thing. The release
# carries `get` as an asset, so releases/latest/download/get is the
# one-liner, and sbom.cdx.json beside it: `spark ver --sbom`, the
# CycloneDX bill of what this tree pins, read from the tree at the tag
# so the bill and the code cannot disagree. Nothing is rerun here: the
# first step refuses a tag whose commit ci.yml has not passed (the one
# check in tests/land.sh, asked on the server whatever a workstation's
# hook did).
name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # gh release create, this job alone
      actions: read     # the first step asks whether ci.yml passed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # spark ver needs the tag reachable to describe it; main and the earlier tags too
          persist-credentials: false   # the fetch below reads a public repository; gh has its own token
      - name: ci.yml passed for the tagged commit
        # the hard gate: a successful ci.yml run must exist for this exact
        # commit (an annotated tag: the commit it points at), else one
        # line and nothing is released. tests/land.sh puts a commit
        # through ci.yml before main, so a tag on main finds its run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tests/land.sh --passed "$(git rev-parse 'HEAD^{commit}')" "$GITHUB_REPOSITORY"
      - name: the tag is signed by a key the release before it trusted
        # actions/checkout peels an annotated tag into a lightweight one on
        # the runner; the signature lives on the tag object, so fetch that
        # object back (forced: the peeled ref must give way) before verifying.
        # A tag never vouches for itself: the keys are the previous
        # release's allowed-signers (the nearest v* tag behind this one, on
        # main, so its tree is main's), and the tag's own file only when no
        # earlier release exists. A rotation is a release signed by the old
        # key that adds the new one. The object's own `tag` header must name
        # the tag: an old signed release pushed again under a new name is no
        # new release.
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_REF_NAME^{commit}" origin/main \
            || { echo "release: $GITHUB_REF_NAME is not on main (CLAUDE.md, Releasing)"; exit 1; }
          keys="$RUNNER_TEMP/allowed-signers"
          if prev=$(git describe --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^{commit}^" 2>/dev/null); then
            git show "$prev:allowed-signers" > "$keys"
            from="$prev's allowed-signers"
          else
            cp allowed-signers "$keys"
            from="its own allowed-signers (no earlier release)"
          fi
          git -c gpg.ssh.allowedSignersFile="$keys" verify-tag "$GITHUB_REF_NAME" \
            || { echo "release: $GITHUB_REF_NAME is not signed by a key in $from (CLAUDE.md, Releasing)"; exit 1; }
          name=$(git cat-file tag "$GITHUB_REF_NAME" | sed -n '/^$/q; s/^tag //p')
          [ "$name" = "$GITHUB_REF_NAME" ] \
            || { echo "release: the tag object $GITHUB_REF_NAME points to is named '$name'"; exit 1; }
          echo "release: $GITHUB_REF_NAME signed by a key in $from"
      - name: the tag agrees with the CHANGELOG
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "## v$v" docs/CHANGELOG.md \
            || { echo "release: tag $GITHUB_REF_NAME but docs/CHANGELOG.md has no '## v$v' heading"; exit 1; }
      - name: the tag agrees with spark ver
        run: |
          v=${GITHUB_REF_NAME#v}
          line=$(python3 bin/spark ver | grep '^spark ')
          [ "$line" = "spark $v" ] \
            || { echo "release: tag $GITHUB_REF_NAME but spark ver says: $line"; exit 1; }
      - name: the SBOM
        # what the release pins, as CycloneDX: spark ver --sbom reads the
        # tree itself (engine.env, models.env), nothing is typed twice
        run: python3 bin/spark ver --sbom > sbom.cdx.json
      - name: the notes are the CHANGELOG section
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v h="## v$v" '$0 == h { on = 1; next } on && /^## / { exit } on' docs/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "release: the '## v$v' section of docs/CHANGELOG.md is empty"; exit 1; }
          cat notes.md
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # `get` rides along as an asset (releases/latest/download/get is the
        # one-liner), and the SBOM beside it
        run: gh release create "$GITHUB_REF_NAME" --title "spark $GITHUB_REF_NAME" --notes-file notes.md --verify-tag get sbom.cdx.json
