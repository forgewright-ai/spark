# pages.yml -- spark.forgewright.ai: the repository's own docs rendered into
# one static site (www/build.py, stdlib) and published with GitHub Pages.
# A doc change on main ships the site, and so does a finished release run
# (release.yml): the sign line names the newest tag and links its release,
# so the page and the GitHub release never disagree. Nothing is written
# twice and no secret is involved (the job's own token deploys). CI proves
# the build (tests/site_test.py) before a merge; this only publishes.
name: pages
on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'assets/**'
      - '*.md'
      - 'CHEATSHEET.txt'
      - 'models.env'
      - '.github/workflows/pages.yml'
  # release.yml creates the Release with the job's own GITHUB_TOKEN, and
  # GitHub raises no event for what that token does -- a `release: published`
  # trigger here never fires. Waiting for the release WORKFLOW instead does.
  workflow_run:   # zizmor: ignore[dangerous-triggers] nothing of the finished run is read: the job checks out main and publishes it
    workflows: [release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pages:
    # workflow_run fires on a FAILED release too: publish only what succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0   # the sign line names the newest tag
          persist-credentials: false
      - name: render
        run: python3 www/build.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: www/dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
