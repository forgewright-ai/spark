<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e0c">
<meta name="description" content="A private AI on a machine you own. No account, no cloud, no subscriptions or paid tokens. One line installs it.">
<link rel="icon" type="image/svg+xml" href="{{BASE}}favicon.svg">
<meta property="og:title" content="spark -- own your AI">
<meta property="og:description" content="A private AI on a machine you own. No account, no cloud, no subscriptions or paid tokens. One line installs it.">
<meta property="og:image" content="https://spark.forgewright.ai/og.png">
<meta property="og:url" content="https://spark.forgewright.ai/{{SLUG}}">
<meta name="twitter:card" content="summary_large_image">
<title>{{TITLE}}</title>
<script>
  /* the chosen theme before first paint, so nothing flashes */
  try {
    var t = localStorage.getItem("spark-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
  :root {
    /* lockstep: these values mirror lib/spark/forge/spark.css :root (the
       ember palette) -- change one there, change it here too; the light
       block below mirrors its light block. tests/docs_test.py checks. */
    --ground: #100e0c;
    --panel: #171412;
    --rule: #2b2622;
    --ink: #e6dfd2;
    --muted: #8f877a;
    --accent: #e0b400;
    --y1: #ffe066;
    --y2: #e0b400;
    --red: #d24a2a;
    --ok: #9ccf6a;
    --mark: #ffe066;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", "JetBrainsMono Nerd Font", ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ground: #f6f0e4;
    --panel: #efe8d8;
    --rule: #d9d1c0;
    --ink: #241f18;
    --muted: #5f5a51;
    --accent: #7d6000;
    --mark: #7d6000;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ground: #f6f0e4;
      --panel: #efe8d8;
      --rule: #d9d1c0;
      --ink: #241f18;
      --muted: #5f5a51;
      --accent: #7d6000;
      --mark: #7d6000;
      color-scheme: light;
    }
  }
  /* the banner: one SVG per theme, the same letters */
  img.b-light, svg.b-light { display: none; }
  :root[data-theme="light"] .b-dark { display: none; }
  :root[data-theme="light"] .b-light { display: block; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .b-dark { display: none; }
    :root:not([data-theme="dark"]) .b-light { display: block; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  code, pre, kbd { font-family: var(--mono); }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--rule); }
  a:hover, a:focus-visible { border-color: var(--accent); outline: none; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
  p { text-wrap: pretty; }

  /* header: the banner on its dark plate, the sign, the nav, the toggle */
  header.wrap { padding-top: 2.5rem; }
  .plate { display: inline-block; border: 0; margin: 0 0 1rem; }
  .banner { display: block; width: min(400px, 100%); height: auto; }
  .sign { margin: 0 0 0.75rem; color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 0.9rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  nav { display: flex; gap: 1.5rem; flex-wrap: wrap; font-family: var(--mono); font-size: 14px; }
  nav a { border: 0; color: var(--muted); }
  nav a:hover, nav a:focus-visible { color: var(--ink); }
  nav a.here { color: var(--ink); }
  nav svg, .tabs svg { width: 1em; height: 1em; fill: currentColor; vertical-align: -0.125em; margin-right: 0.6ch; }
  #theme { font-family: var(--mono); font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 0.35rem 0.9rem; cursor: pointer; }
  #theme:hover, #theme:focus-visible { color: var(--ink); border-color: var(--muted); outline: none; }

  /* the hero */
  .hero { padding: 4rem 0 2rem; }
  .hero h1 { font-size: clamp(2.4rem, 5.5vw, 4.25rem); line-height: 1.05; letter-spacing: -0.02em; font-weight: 700; margin: 0 0 1.5rem; max-width: 24ch; }
  .lede { font-size: 1.25rem; line-height: 1.55; margin: 0 0 2rem; max-width: 46rem; }

  /* the one-liner and the windows: terminals, dark in both themes */
  .oneliner { display: flex; align-items: center; gap: 1.5ch; flex-wrap: nowrap; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 0.9rem 1.1rem; margin: 0 0 1.25rem; max-width: 52rem; }
  .oneliner code { flex: 1 1 0; min-width: 0; overflow-x: auto; white-space: nowrap; color: var(--ink); font-size: 14.5px; }
  .oneliner button { font-family: var(--mono); font-size: 13px; color: #100e0c; background: var(--y2); border: 0; border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; }
  .oneliner button:hover, .oneliner button:focus-visible { background: var(--y1); outline: none; }
  .win { margin: 0 0 1.25rem; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; max-width: 52rem; }
  .win figcaption { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 0.55rem 1.1rem; border-bottom: 1px solid var(--rule); }
  .win figcaption b { color: var(--ink); font-weight: 600; }
  .win pre { margin: 0; padding: 0.9rem 1.1rem; font-size: 14.5px; line-height: 1.6; color: var(--ink); overflow-x: auto; }
  .win .c, .win .p { color: var(--muted); }
  .win .mark { color: var(--mark); }
  .caret::after {
    content: ""; display: inline-block; width: 0.6ch; height: 1.1em; vertical-align: -0.2em;
    background: var(--mark); margin-left: 0.3ch; animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .caret::after { animation: none; } }
  pre[data-doc] { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; color: var(--ink); padding: 0.9rem 1.1rem; margin: 0 0 1.25rem; overflow-x: auto; font-size: 14.5px; line-height: 1.6; max-width: 52rem; }

  /* the stages: a sticky tag on the left, the work on the right */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem 4rem; padding: 4.5rem 0; border-top: 1px solid var(--rule); }
  .stage .tag h2 { font-size: 1.7rem; line-height: 1.15; letter-spacing: -0.01em; font-weight: 700; margin: 0; }
  .stage .tag p { color: var(--muted); margin: 0.75rem 0 0; font-size: 1rem; }
  .stage .body > p { max-width: 46rem; margin: 0 0 1.25rem; }
  @media (min-width: 900px) {
    .stage { grid-template-columns: 17rem minmax(0, 1fr); }
    .stage .tag { position: sticky; top: 2rem; align-self: start; }
  }
  .hint { color: var(--muted); font-size: 0.95em; max-width: 46rem; }

  /* the OS picker: radios and labels, no JS required */
  .os { position: relative; margin: 0 0 1.5rem; }
  .os input { position: absolute; opacity: 0; pointer-events: none; }
  .os .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1.25rem; }
  .os .tabs label { font-family: var(--mono); font-size: 13.5px; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 0.45rem 1rem; cursor: pointer; }
  .os .tabs label:hover { color: var(--ink); border-color: var(--muted); }
  .os .panel { display: none; }
  #os-debian:checked ~ .tabs label[for="os-debian"],
  #os-arch:checked ~ .tabs label[for="os-arch"],
  #os-macos:checked ~ .tabs label[for="os-macos"],
  #os-windows:checked ~ .tabs label[for="os-windows"] { color: #100e0c; background: var(--y2); border-color: var(--y2); }
  #os-debian:focus-visible ~ .tabs label[for="os-debian"],
  #os-arch:focus-visible ~ .tabs label[for="os-arch"],
  #os-macos:focus-visible ~ .tabs label[for="os-macos"],
  #os-windows:focus-visible ~ .tabs label[for="os-windows"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  #os-debian:checked ~ .panel[data-os="debian"],
  #os-arch:checked ~ .panel[data-os="arch"],
  #os-macos:checked ~ .panel[data-os="macos"],
  #os-windows:checked ~ .panel[data-os="windows"] { display: block; }
  .os .panel > p { max-width: 46rem; margin: 0 0 1rem; }

  /* the verb list and the cards */
  .verbs { list-style: none; margin: 0 0 1.25rem; padding: 0; max-width: 46rem; }
  .verbs li { display: flex; gap: 1.5ch; padding: 0.5rem 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .verbs code { color: var(--accent); white-space: nowrap; font-size: 14px; }
  .verbs span { color: var(--muted); flex: 1 1 12rem; font-size: 0.95em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; margin: 0 0 1.5rem; }
  .cards > div { border: 1px solid var(--rule); border-radius: 10px; padding: 1.1rem 1.2rem; background: var(--panel); }
  .cards h3 { margin: 0 0 0.5rem; font-size: 1.05rem; }
  .cards svg.ci { width: 20px; height: 20px; display: block; margin: 0 0 0.7rem; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .cards p { margin: 0; color: var(--muted); font-size: 0.95rem; }

  /* the docs, rendered: sans prose around dark code */
  .cmd { font-family: var(--mono); margin: 0 0 1rem; color: var(--ink); font-weight: 600; }
  .cmd .p { color: var(--muted); font-weight: 400; }
  .cmd .k { color: var(--accent); font-weight: 400; }
  .toc { border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); padding: 1rem 1.25rem; margin: 2rem 0 0; max-width: 52rem; }
  .toc p { margin: 0 0 0.5rem; color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .toc ul { margin: 0; padding: 0; list-style: none; column-width: 16rem; column-gap: 2rem; }
  .toc li { margin: 0 0 0.3rem; break-inside: avoid; font-size: 0.95em; }
  .toc a { border: 0; }
  .doc { padding: 1.5rem 0 2rem; max-width: 52rem; }
  .doc h1 { font-size: 2rem; letter-spacing: -0.01em; margin: 1rem 0 1.25rem; }
  .doc h2 { font-size: 1.4rem; margin: 2.75rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
  .doc h3 { font-size: 1.1rem; margin: 1.75rem 0 0.75rem; }
  .doc p { margin: 0 0 1rem; }
  .doc pre { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; color: var(--ink); padding: 0.9rem 1.1rem; margin: 0 0 1.25rem; overflow-x: auto; font-size: 14.5px; line-height: 1.6; }
  .doc p code, .doc li code, .doc td code, .doc th code { font-size: 0.9em; color: var(--accent); background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 0.1em 0.35em; }
  .doc ul, .doc ol { margin: 0 0 1rem; padding-left: 1.5rem; }
  .doc li { margin: 0 0 0.4rem; }
  .doc ul ul { margin: 0.4rem 0 0; }
  .doc table { border-collapse: collapse; margin: 0 0 1.25rem; display: block; overflow-x: auto; font-size: 0.95em; }
  .doc th, .doc td { text-align: left; vertical-align: top; padding: 0.45rem 1.5ch 0.45rem 0; border-bottom: 1px solid var(--rule); }
  .doc th { color: var(--muted); font-weight: 500; }
  .doc td:not(:last-child), .doc th:not(:last-child) { white-space: nowrap; }
  .doc td.r, .doc th.r { text-align: right; }
  .doc td.q { color: var(--muted); }
  .doc b { font-weight: 600; }

  footer { border-top: 1px solid var(--rule); margin-top: 4rem; }
  footer .wrap { padding-top: 1.5rem; padding-bottom: 2.5rem; color: var(--muted); font-size: 14px; }
  footer p { margin: 0 0 0.5rem; }
  footer .foot { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
  footer svg.s { width: 15px; height: 20px; flex: none; }
  @media (max-width: 640px) { body { font-size: 16px; } }
</style>
</head>
<body>
<header class="wrap">
  <a class="plate" href="{{BASE}}"><img class="banner b-dark" src="{{BASE}}banner.svg" alt="spark" width="400" height="108"><img class="banner b-light" src="{{BASE}}banner-light.svg" alt="spark" width="400" height="108"></a>
  <p class="sign"><a href="{{RELEASE}}">spark {{VERSION}}</a> . by forgewright-ai</p>
  <div class="bar">
    <nav>{{NAV}}</nav>
    <button id="theme" type="button" aria-label="switch between the dark and light theme">theme</button>
  </div>
</header>
<main class="wrap">
{{BODY}}
</main>
<footer>
  <div class="wrap">
    <p class="foot">{{SMARK}}<span><a href="{{BASE}}roadmap/">roadmap</a> . <a href="{{BASE}}contributing/">contributing</a> . <a href="{{BASE}}credits/">credits</a> . <a href="https://www.forgewright.ai">www.forgewright.ai</a> . <a href="https://github.com/forgewright-ai">github.com/forgewright-ai</a></span></p>
  </div>
</footer>

<script>
  (function () {
    var doc = document.documentElement;

    /* the theme toggle names the theme it switches to */
    var bt = document.getElementById("theme");
    function mode() {
      var t = doc.getAttribute("data-theme");
      if (t === "light" || t === "dark") return t;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    function label() {
      if (bt) bt.textContent = mode() === "dark" ? "light" : "dark";
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.content = mode() === "dark" ? "#100e0c" : "#f6f0e4";
    }
    if (bt) bt.addEventListener("click", function () {
      var next = mode() === "dark" ? "light" : "dark";
      doc.setAttribute("data-theme", next);
      try { localStorage.setItem("spark-theme", next); } catch (e) {}
      label();
    });
    label();

    /* every copy button copies the element its data-copy names */
    var copies = document.querySelectorAll("button[data-copy]");
    for (var i = 0; i < copies.length; i++) (function (b) {
      var c = document.getElementById(b.getAttribute("data-copy"));
      if (!c || !navigator.clipboard) return;
      b.addEventListener("click", function () {
        navigator.clipboard.writeText(c.textContent).then(function () {
          b.textContent = "copied"; setTimeout(function () { b.textContent = "copy"; }, 1500);
        });
      });
    })(copies[i]);

    /* the OS picker: the last choice, else this machine's OS */
    var radios = document.querySelectorAll('.os input[type="radio"]');
    if (radios.length) {
      var os = null;
      try { os = localStorage.getItem("spark-os"); } catch (e) {}
      if (!os) {
        var ua = navigator.userAgent;
        os = /Windows/.test(ua) ? "windows" : /Mac/.test(ua) ? "macos" : "debian";
      }
      var r = document.getElementById("os-" + os);
      if (r) r.checked = true;
      function keep() {
        try { localStorage.setItem("spark-os", this.id.replace("os-", "")); } catch (e) {}
      }
      for (var j = 0; j < radios.length; j++) radios[j].addEventListener("change", keep);
    }
  })();
</script>
</body>
</html>
